server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location ~ ^/(_serverFn|api|~api)(/|$) {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 50m;
  }

  # Always revalidate the page and the dashboard files so updates are picked up immediately.
  location = /index.html { add_header Cache-Control "no-cache"; }
  location ~ ^/assets/sales-dashboard\.(js|css)$ { add_header Cache-Control "no-cache"; }

  location / {
    try_files $uri /index.html;
  }
}
